<div class="snap-layouts" role="menu" aria-label="Snap layouts">
  <div class="snap-layout snap-layout-halves">
    <button type="button" class="snap-cell" role="menuitem" data-zone="left" aria-label="Left half"></button>
    <button type="button" class="snap-cell" role="menuitem" data-zone="right" aria-label="Right half"></button>
  </div>
  <div class="snap-layout snap-layout-quarters">
    <button type="button" class="snap-cell" role="menuitem" data-zone="top-left" aria-label="Top left quarter"></button>
    <button type="button" class="snap-cell" role="menuitem" data-zone="top-right" aria-label="Top right quarter"></button>
    <button type="button" class="snap-cell" role="menuitem" data-zone="bottom-left" aria-label="Bottom left quarter"></button>
    <button type="button" class="snap-cell" role="menuitem" data-zone="bottom-right" aria-label="Bottom right quarter"></button>
  </div>
  <div class="snap-layout snap-layout-mixed">
    <button type="button" class="snap-cell" role="menuitem" data-zone="left" aria-label="Left half"></button>
    <button type="button" class="snap-cell" role="menuitem" data-zone="top-right" aria-label="Top right quarter"></button>
    <button type="button" class="snap-cell" role="menuitem" data-zone="bottom-right" aria-label="Bottom right quarter"></button>
  </div>
</div>
