<div class="window">
  <span id="se-resize-handle" class="resize-handle" data-direction="se"></span>
  <span id="s-resize-handle" class="resize-handle" data-direction="s"></span>
  <span id="e-resize-handle" class="resize-handle" data-direction="e"></span>
  <div class="top-bar" id="window-top-bar">
    <span id="window-title" class="window-title">Window</span>
    <span id="window-buttons" class="window-buttons">
      <button id="window-minimize-button" class="window-button" type="button" aria-label="Minimize" title="Minimize">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5h7" /></svg>
      </button>
      <button id="window-maximize-button" class="window-button" type="button" aria-label="Maximize" title="Maximize">
        <svg class="icon-maximize" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" rx="1" /></svg>
        <svg class="icon-restore" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="3" width="5.5" height="5.5" rx="1" /><path d="M3.5 3V2.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H7" /></svg>
      </button>
      <button id="window-close-button" class="window-button window-button-close" type="button" aria-label="Close" title="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
      </button>
    </span>
  </div>
  <div id="window-content"></div>
</div>
