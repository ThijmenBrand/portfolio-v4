<div class="picker" role="dialog" aria-modal="true" tabindex="-1">
  <header class="picker-head">
    <span class="picker-title"></span>
    <div class="picker-bar">
      <nav class="picker-crumbs" aria-label="Location"></nav>
      <button type="button" class="picker-icon picker-new" title="New Folder" aria-label="New Folder">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 6.5v5M5.5 9h5"/></svg>
      </button>
      <input type="search" class="picker-search" placeholder="Search" aria-label="Search in this folder" spellcheck="false" />
    </div>
  </header>
  <div class="picker-body">
    <nav class="picker-places" aria-label="Places"></nav>
    <div class="picker-list" role="listbox"></div>
  </div>
  <footer class="picker-actions">
    <button type="button" class="picker-btn picker-cancel">Cancel</button>
    <button type="button" class="picker-btn primary picker-open">Open</button>
  </footer>
</div>
