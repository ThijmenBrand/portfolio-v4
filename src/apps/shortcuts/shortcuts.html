<main class="shortcuts">
  <header class="top">
    <nav class="tabs" aria-label="Spaces" data-field="spaces"></nav>
    <button type="button" class="mode" data-field="mode" data-action="auto"></button>
    <button type="button" class="icon-button" data-action="settings" aria-label="Space settings" title="Space settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg>
    </button>
  </header>

  <nav class="projects" aria-label="Projects" data-field="projects"></nav>

  <section class="empty" data-field="empty" hidden>
    <h1>Your sites, one key away</h1>
    <p>Add a site and it gets a number. Press that number to open it in a new tab.</p>
    <div class="suggestions" role="group" aria-label="Suggested sites" data-field="suggestions"></div>
  </section>

  <ol class="dial" aria-label="Shortcuts" data-field="dial"></ol>

  <section class="settings" data-field="settings" hidden></section>

  <footer class="bar">
    <p class="keys">
      <span><kbd>1</kbd>–<kbd>9</kbd> open</span>
      <span><kbd>[</kbd><kbd>]</kbd> project</span>
      <span><kbd>{</kbd><kbd>}</kbd> space</span>
      <span><kbd>E</kbd> edit</span>
    </p>
    <output class="status" aria-live="polite" data-field="status">
      <span data-field="status-text"></span>
      <button type="button" class="link" data-action="undo" hidden>Undo</button>
    </output>
  </footer>
</main>

<template id="editor">
  <li class="editor">
    <span class="mono mono-preview" aria-hidden="true"><span class="mono-letter">+</span></span>
    <div class="editor-fields">
      <label class="field">
        <span>Address</span>
        <input name="url" type="text" inputmode="url" placeholder="github.com" spellcheck="false" autocomplete="off" />
      </label>
      <label class="field">
        <span>Name</span>
        <input name="name" type="text" placeholder="Name" maxlength="40" autocomplete="off" />
      </label>
      <label class="field" data-field="project-field">
        <span>Project</span>
        <select name="project"></select>
      </label>
      <p class="editor-error" role="alert"></p>
    </div>
    <div class="editor-actions">
      <button type="button" class="button button-danger" data-action="remove">Remove</button>
      <span class="spacer"></span>
      <button type="button" class="button" data-action="cancel">Cancel</button>
      <button type="button" class="button button-primary" data-action="save">Add</button>
    </div>
  </li>
</template>

<template id="settings">
  <div class="settings-body">
    <label class="field">
      <span>Name</span>
      <input name="space-name" type="text" maxlength="30" autocomplete="off" />
    </label>

    <section class="group">
      <h2>Projects</h2>
      <ul class="rows" data-field="project-list"></ul>
      <button type="button" class="link" data-action="add-project">+ Add project</button>
    </section>

    <section class="group">
      <h2>Schedule</h2>
      <p class="hint">This space opens on its own during these times. Spaces further left win when times overlap; drag the tabs to change the order.</p>
      <ul class="rows" data-field="rules"></ul>
      <button type="button" class="link" data-action="add-rule">+ Add rule</button>
      <div class="week" data-field="week" aria-label="Week overview"></div>
    </section>

    <section class="group">
      <h2>All spaces</h2>
      <label class="field">
        <span>Default space</span>
        <select name="default-space"></select>
      </label>
      <p class="hint">Opens when no schedule rule matches the time.</p>
    </section>
  </div>
  <div class="editor-actions settings-actions">
    <button type="button" class="button button-danger" data-action="delete-space">Delete space</button>
    <span class="spacer"></span>
    <button type="button" class="button button-primary" data-action="done">Done</button>
  </div>
</template>

<template id="rule">
  <li class="rule">
    <div class="days" role="group" aria-label="Days"></div>
    <input name="from" type="time" aria-label="From" />
    <span class="dash" aria-hidden="true">–</span>
    <input name="to" type="time" aria-label="Until" />
    <label class="check"><input name="all-day" type="checkbox" /> All day</label>
    <button type="button" class="icon-button" data-action="remove-rule" aria-label="Remove rule" title="Remove rule">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
    </button>
  </li>
</template>
