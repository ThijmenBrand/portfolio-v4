<main class="about">
  <header class="hero">
    <span class="thumb" data-field="wallpaper-thumb"></span>
    <span class="hero-text">
      <span class="os-name" data-field="os"></span>
      <span class="os-version" data-field="version"></span>
    </span>
  </header>

  <dl class="group">
    <div class="row"><dt>Uptime</dt><dd data-field="uptime"></dd></div>
    <div class="row"><dt>User</dt><dd data-field="user"></dd></div>
    <div class="row"><dt>Processes</dt><dd data-field="processes"></dd></div>
    <div class="row"><dt>Open windows</dt><dd data-field="windows"></dd></div>
    <div class="row"><dt>Installed apps</dt><dd data-field="apps"></dd></div>
    <div class="row"><dt>Storage</dt><dd data-field="storage"></dd></div>
    <div class="row"><dt>Theme</dt><dd data-field="theme"></dd></div>
    <div class="row"><dt>Browser</dt><dd class="mono" data-field="browser"></dd></div>
  </dl>
</main>
