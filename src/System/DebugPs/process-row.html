<tr class="ps-row" data-pid="">
  <td class="col-num" data-field="pid"></td>
  <td class="col-num" data-field="parentPid"></td>
  <td class="col-path" data-field="path" title=""></td>
  <td><span class="pill" data-field="status" data-status=""></span></td>
  <td class="col-num" data-field="windows"></td>
  <td class="col-num" data-field="uptime"></td>
  <td class="col-actions">
    <button
      type="button"
      class="row-action"
      data-action="sigterm"
      title="Send SIGTERM"
    >
      TERM
    </button>
    <button
      type="button"
      class="row-action is-danger"
      data-action="sigkill"
      title="Send SIGKILL"
    >
      KILL
    </button>
  </td>
</tr>
