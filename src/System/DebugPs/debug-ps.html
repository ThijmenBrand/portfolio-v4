<div id="debug-ps" class="debug-ps">
  <div class="debug-ps-toolbar">
    <div class="tabs" role="tablist">
      <button
        type="button"
        class="tab is-active"
        role="tab"
        id="tab-running"
        aria-controls="panel-running"
        aria-selected="true"
        data-tab="running"
      >
        Running
        <span class="tab-count" data-field="running-count">0</span>
      </button>
      <button
        type="button"
        class="tab"
        role="tab"
        id="tab-terminated"
        aria-controls="panel-terminated"
        aria-selected="false"
        data-tab="terminated"
      >
        Terminated
        <span class="tab-count" data-field="terminated-count">0</span>
      </button>
    </div>

    <div class="search">
      <input
        type="search"
        class="search-input"
        id="debug-ps-search"
        placeholder="Filter by pid, path or status…"
        autocomplete="off"
        spellcheck="false"
      />
      <button
        type="button"
        class="search-clear"
        data-action="clear-search"
        title="Clear filter"
      >
        ×
      </button>
    </div>
  </div>

  <section
    class="panel is-active"
    role="tabpanel"
    id="panel-running"
    aria-labelledby="tab-running"
    data-panel="running"
  >
    <table class="ps-table">
      <thead>
        <tr>
          <th class="col-num" data-sort="pid" aria-sort="ascending">
            <button type="button" class="th-sort">
              PID<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-num" data-sort="parentPid" aria-sort="none">
            <button type="button" class="th-sort">
              PPID<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-path" data-sort="path" aria-sort="none">
            <button type="button" class="th-sort">
              Path<span class="th-arrow"></span>
            </button>
          </th>
          <th data-sort="status" aria-sort="none">
            <button type="button" class="th-sort">
              Status<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-num" data-sort="uptime" aria-sort="none">
            <button type="button" class="th-sort">
              Uptime<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody data-field="running-rows"></tbody>
    </table>
    <p class="table-empty" data-field="running-empty" hidden>
      No matching processes.
    </p>
  </section>

  <section
    class="panel"
    role="tabpanel"
    id="panel-terminated"
    aria-labelledby="tab-terminated"
    aria-hidden="true"
    data-panel="terminated"
    hidden
  >
    <table class="ps-table">
      <thead>
        <tr>
          <th class="col-num" data-sort="pid" aria-sort="none">
            <button type="button" class="th-sort">
              PID<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-num" data-sort="parentPid" aria-sort="none">
            <button type="button" class="th-sort">
              PPID<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-path" data-sort="path" aria-sort="none">
            <button type="button" class="th-sort">
              Path<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-num" data-sort="code" aria-sort="none">
            <button type="button" class="th-sort">
              Code<span class="th-arrow"></span>
            </button>
          </th>
          <th data-sort="reason" aria-sort="none">
            <button type="button" class="th-sort">
              Reason<span class="th-arrow"></span>
            </button>
          </th>
          <th data-sort="signal" aria-sort="none">
            <button type="button" class="th-sort">
              Signal<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-num" data-sort="lifetime" aria-sort="none">
            <button type="button" class="th-sort">
              Lifetime<span class="th-arrow"></span>
            </button>
          </th>
          <th class="col-num" data-sort="at" aria-sort="descending">
            <button type="button" class="th-sort">
              Exited<span class="th-arrow"></span>
            </button>
          </th>
        </tr>
      </thead>
      <tbody data-field="terminated-rows"></tbody>
    </table>
    <p class="table-empty" data-field="terminated-empty" hidden>
      No terminated processes yet.
    </p>
  </section>

  <footer class="statusbar">
    <span data-field="summary"></span>
  </footer>
</div>
