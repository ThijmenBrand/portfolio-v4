<div class="login">
  <form class="login-card" data-field="form">
    <h1 class="login-title">Log in</h1>
    <div class="login-users" data-field="users"></div>
    <input
      class="login-input"
      data-field="name"
      aria-label="User name"
      placeholder="User name"
      autocomplete="username"
      autocapitalize="off"
      spellcheck="false"
      required
    />
    <input
      class="login-input"
      data-field="password"
      type="password"
      aria-label="Password"
      placeholder="Password"
      autocomplete="current-password"
    />
    <button class="login-submit" type="submit">Log in</button>
    <p class="login-error" data-field="error" role="alert"></p>
  </form>
</div>
